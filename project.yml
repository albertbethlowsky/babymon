name: Babymon
options:
  bundleIdPrefix: com.babymon
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"

targets:
  Babymon:
    type: application
    platform: iOS
    sources:
      - path: Babymon
      - path: Shared
    settings:
      base:
        INFOPLIST_KEY_NSCameraUsageDescription: "Babymon needs camera access to stream video to your Apple Watch"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Babymon needs microphone access to stream audio to your Apple Watch"
        INFOPLIST_KEY_UIBackgroundModes: "audio"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    entitlements:
      path: Babymon/Babymon.entitlements
      properties: {}
  BabymonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BabymonTests
    dependencies:
      - target: Babymon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  BabymonWatch:
    type: application
    platform: watchOS
    sources:
      - path: BabymonWatch
      - path: Shared
    settings:
      base:
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Babymon needs microphone access to stream audio to your iPhone"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.babymon.Babymon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    entitlements:
      path: BabymonWatch/BabymonWatch.entitlements
      properties: {}
